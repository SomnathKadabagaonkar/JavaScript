<html>
<head>
  <title>background-color</title>
  </head>
<body>

   <div onmouseover="changeColor(this)" style=" height:2000px; width:2000px; background-color: rgb(244, 239, 239);"></div>
  <script>
    function changeColor(ele) 
	{
    ele.style.backgroundColor="red"
    }
  </script> 
</body>
</html>
