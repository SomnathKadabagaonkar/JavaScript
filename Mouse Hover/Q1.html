<html>
<head>
  <title>Onmouse over</title>
  </head>
<body>

    <p onmouseover="changeColor(this)">This paragraph will be hidden when the selection changes.</p>
   <h1 onmouseover="changeColor(this)">HEADING1</h1>
  <script>
    function changeColor(ele) 
	{
    ele.style.fontSize="10px"
    ele.style.color="red"
    }
  </script>

</body>
</html>
