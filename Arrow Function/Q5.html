<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even OR ODD</title>
</head>
<body>
    <script>
    const EvenOdd=(n)=>
    {
    if(n%2==0)
    {
        console.log(`${"Even"}`)
    }
    else
    {
    console.log(`${"ODD"}`)
    }
    }
    console.log(`${EvenOdd(11)}`)
    </script>
</body>
</html>
