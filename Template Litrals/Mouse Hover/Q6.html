<!DOCTYPE html>
<html>
<head>
  <title>Key Press Alert Program</title>
</head>
<body>

<input type="text" id="myInput" placeholder="Type something">

<script>
  var input = document.getElementById("myInput");
  input.onkeydown = function() 
  {
    alert("HI"+input);
  }
</script>

</body>
</html>
