<!DOCTYPE html>
<html lang="en">
<head>

    <title>Template Litrals(Adding Numbers)</title>
</head>
<body>

        var a=eval(prompt("Enter First Number"))
        var b=eval(prompt("Enter Second Number"))
        console.log(`Addition is ${a+b}`)
